server:
  port: ${PORT:8080}
spring:
  application:
    name: "Franchise"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://admin:admin123@localhost:27017/franchisedb?authSource=admin}
      auto-index-creation: true
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
