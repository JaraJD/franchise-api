name: CD

on:
  push:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew build --no-daemon

  deploy:
    name: Build Image & Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 21 for Docker build
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and push Docker image to ECR
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REPOSITORY_URL:$IMAGE_TAG -t $ECR_REPOSITORY_URL:latest .
          docker push $ECR_REPOSITORY_URL:$IMAGE_TAG
          docker push $ECR_REPOSITORY_URL:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: ECR_REPOSITORY_URL,AWS_REGION
          script: |
            set -e
            ECR_HOST=$(echo "$ECR_REPOSITORY_URL" | cut -d'/' -f1)

            # Login to ECR
            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin "$ECR_HOST"

            # Ensure app directory exists
            sudo mkdir -p /opt/franchise-api

            # Write docker-compose.yml if not present
            if [ ! -f /opt/franchise-api/docker-compose.yml ]; then
              sudo tee /opt/franchise-api/docker-compose.yml > /dev/null << EOF
            version: '3.9'
            services:
              mongodb:
                image: mongo:7.0
                container_name: franchise-mongo
                restart: unless-stopped
                environment:
                  MONGO_INITDB_ROOT_USERNAME: ${{ secrets.DB_USERNAME }}
                  MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  MONGO_INITDB_DATABASE: franchisedb
                volumes:
                  - mongo-data:/data/db
              franchise-api:
                image: ${ECR_REPOSITORY_URL}:latest
                container_name: franchise-api
                restart: unless-stopped
                ports:
                  - "8080:8080"
                environment:
                  MONGODB_URI: "mongodb://${{ secrets.DB_USERNAME }}:${{ secrets.DB_PASSWORD }}@mongodb:27017/franchisedb?authSource=admin"
                  PORT: "8080"
                depends_on:
                  - mongodb
            volumes:
              mongo-data:
                driver: local
            EOF
            fi

            # Pull latest image and restart
            sudo docker pull "$ECR_REPOSITORY_URL:latest"
            sudo docker compose -f /opt/franchise-api/docker-compose.yml up -d
            echo "Deploy completed at $(date)"
